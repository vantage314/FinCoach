services:
  - type: web
    name: fincoach-spring-api
    runtime: docker
    plan: free
    region: singapore
    branch: codex/fincoach-render-api
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/auth/test
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod-pg
      - key: DATABASE_URL
        fromDatabase:
          name: fincoach-postgres
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: fincoach-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: fincoach-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fincoach-postgres
          property: password
      - key: DEEPSEEK_API_KEY
        value: not-configured
