server:
  port: 8080

spring:
  profiles:
    active: dev-mysql
  datasource:
    hikari:
      maximum-pool-size: 10

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.fincoach.core.repository.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.fincoach.core: DEBUG
    org.springframework.web: DEBUG
    org.mybatis: DEBUG
  file:
    name: ../log/backend/fincoach.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

crawler:
  staleThresholdSeconds: 30
  logMaxChars: 4000
  selfHealEnabled: true

# AI 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-29b99ee5073847c89b6ccdabc9e21c27}

ai:
  # 使用 DeepSeek 的 API 地址 (兼容 OpenAI 格式)
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${deepseek.api-key}
  model: ${DEEPSEEK_MODEL:deepseek-chat}

fincoach:
  ticker-mapping:
    db:
      enabled: true
  portfolio:
    debug:
      capture-enabled: false
    correlation:
      min-gap-ratio: 0.6
    snapshot:
      enabled: false
      preferCache: false
      lookbackDays: 90
